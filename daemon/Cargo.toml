[package]
name = "computad"
version = "0.1.0"
edition = "2024"
description = "Collects system metrics and serves them to the Computa menu bar app"
publish = false

[dependencies]
anyhow = "1"
core-foundation = "0.10"
icns = { version = "0.5", default-features = false, features = ["pngio"] }
libc = "0.2"
plist = { version = "1.10", default-features = false }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "time"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
tonic-prost-build = "0.14"

[lints.clippy]
all = "deny"
